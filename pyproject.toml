[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "takeovers-bilan"
version = "0.1.0"
description = "Deterministic, provenance-first extractor for the Takeovers Bilan challenge"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.28.2",
  "jsonschema==4.26.0",
  "Pillow==12.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
